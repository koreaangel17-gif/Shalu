<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHALU — The Birthday Surprise ❤️</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Georgia, 'Times New Roman', serif;
  color: #ffffff;
}

body {
  background: radial-gradient(ellipse at 50% 30%, #3a0f33 0%, #1a0820 50%, #07020b 100%);
}

#scene {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
}

#hearts {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  bottom: -40px;
  opacity: 0;
  animation-name: floatUp;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes floatUp {
  0%   { transform: translateY(0) scale(0.6); opacity: 0; }
  10%  { opacity: 0.9; }
  100% { transform: translateY(-115vh) scale(1.2) rotate(20deg); opacity: 0; }
}

#welcome {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  transition: opacity 1.2s ease, transform 1.2s ease;
}

#welcome.leaving {
  opacity: 0;
  transform: scale(1.15);
  pointer-events: none;
}

.welcome-box { max-width: 420px; }

.small {
  letter-spacing: 4px;
  text-transform: uppercase;
  font-size: 13px;
  color: #f3d98b;
  margin-bottom: 14px;
}

.glow-title {
  font-size: 76px;
  font-style: italic;
  font-weight: normal;
  color: #ffe9a8;
  animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { text-shadow: 0 0 10px #ffcf5a, 0 0 28px #ff9ec4, 0 0 50px #ff4f93; }
  50%      { text-shadow: 0 0 16px #ffe08a, 0 0 42px #ffb3d1, 0 0 80px #ff2f7f; }
}

.sub {
  margin: 18px 0 36px;
  font-size: 17px;
  line-height: 1.6;
  color: #ffd9e8;
}

#openBtn {
  font-family: inherit;
  font-size: 19px;
  padding: 15px 38px;
  border: none;
  border-radius: 50px;
  color: #3a1200;
  font-weight: bold;
  background: linear-gradient(135deg, #ffe08a, #e0a526, #ffd45c);
  box-shadow: 0 0 20px rgba(255, 200, 80, 0.6);
  animation: btnPulse 2s ease-in-out infinite;
}

#openBtn:active { transform: scale(0.95); }

@keyframes btnPulse {
  0%, 100% { box-shadow: 0 0 16px rgba(255, 200, 80, 0.5); }
  50%      { box-shadow: 0 0 34px rgba(255, 200, 80, 0.95); }
}

.hidden { display: none !important; }

#reveal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  font-size: 20px;
  color: #ffe9a8;
  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.bokeh {
  position: fixed;
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
  filter: blur(6px);
  opacity: 0;
  animation-name: bokehDrift;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes bokehDrift {
  0%   { transform: translateY(0) scale(1); opacity: 0; }
  20%  { opacity: 0.35; }
  80%  { opacity: 0.25; }
  100% { transform: translateY(-30vh) scale(1.3); opacity: 0; }
}

#vignette {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%);
}

#msgBtn {
  position: fixed;
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-family: inherit;
  font-size: 18px;
  padding: 13px 30px;
  border: none;
  border-radius: 50px;
  color: #3a1200;
  font-weight: bold;
  background: linear-gradient(135deg, #ffe08a, #e0a526, #ffd45c);
  box-shadow: 0 0 22px rgba(255, 200, 80, 0.7);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}

#msgBtn.show { opacity: 1; pointer-events: auto; }

#letter {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 40;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8, 2, 12, 0.78);
}

#letter.open { display: flex; animation: fadeIn 0.8s ease; }

.letter-card {
  max-width: 440px;
  width: 100%;
  max-height: 82vh;
  overflow-y: auto;
  padding: 28px 24px;
  border-radius: 18px;
  border: 2px solid #e8b53a;
  background: linear-gradient(160deg, rgba(58, 15, 51, 0.96), rgba(26, 8, 32, 0.97));
  box-shadow: 0 0 40px rgba(255, 200, 90, 0.35);
  text-align: center;
}

.letter-card h2 {
  font-size: 28px;
  font-style: italic;
  font-weight: normal;
  color: #ffe9a8;
  margin-bottom: 18px;
  animation: glowPulse 3s ease-in-out infinite;
}

.letter-card p {
  font-size: 17px;
  line-height: 1.7;
  color: #ffd9e8;
  margin-bottom: 12px;
  opacity: 0;
  animation: lineIn 0.9s ease forwards;
}

.letter-card p.sign { color: #f3d98b; font-style: italic; margin-top: 18px; }

@keyframes lineIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

#closeLetter {
  margin-top: 16px;
  font-family: inherit;
  font-size: 16px;
  padding: 10px 28px;
  border: none;
  border-radius: 40px;
  color: #3a1200;
  font-weight: bold;
  background: linear-gradient(135deg, #ffe08a, #e0a526);
}

/* ---------- Cut the cake button ---------- */
#cutBtn {
  position: fixed;
  bottom: calc(94px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-family: inherit;
  font-size: 18px;
  padding: 13px 30px;
  border: none;
  border-radius: 50px;
  color: #ffffff;
  font-weight: bold;
  background: linear-gradient(135deg, #ff7eb6, #e0306f, #ff5a9a);
  box-shadow: 0 0 22px rgba(255, 90, 150, 0.75);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}
#cutBtn.show { opacity: 1; pointer-events: auto; }
#cutBtn:active { transform: translateX(-50%) scale(0.95); }

/* ---------- Gift message after cutting ---------- */
#gift {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8, 2, 12, 0.78);
}
#gift.open { display: flex; animation: fadeIn 0.8s ease; }
#closeGift {
  margin-top: 16px;
  font-family: inherit;
  font-size: 16px;
  padding: 10px 28px;
  border: none;
  border-radius: 40px;
  color: #3a1200;
  font-weight: bold;
  background: linear-gradient(135deg, #ffe08a, #e0a526);
}

/* ---------- Confetti ---------- */
#confetti {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 70;
  pointer-events: none;
}

/* ---------- Music mute button ---------- */
#muteBtn {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: 14px;
  z-index: 30;
  width: 46px;
  height: 46px;
  font-size: 22px;
  border: none;
  border-radius: 50%;
  background: rgba(20, 6, 26, 0.6);
  box-shadow: 0 0 14px rgba(255, 200, 90, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}
#muteBtn.show { opacity: 1; pointer-events: auto; }

html, body { touch-action: none; }

/* ---------- Opening: pink digital rain + countdown ---------- */
#intro { position: fixed; inset: 0; z-index: 100; background: #0c0214; transition: opacity 1.2s ease; }
#intro.leaving { opacity: 0; pointer-events: none; }
#introRain { position: absolute; inset: 0; width: 100%; height: 100%; }
#introWord {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: 'Trebuchet MS', Arial, sans-serif; font-weight: 800; letter-spacing: 4px;
  font-size: 120px; color: #ff5fb0; text-shadow: 0 0 18px #ff2f8f, 0 0 46px #ff2f8f;
  pointer-events: none; opacity: 0;
}
#introWord.longword { font-size: clamp(34px, 11vw, 70px); }
#introWord.heartword { font-size: 130px; }
#introWord.pop { animation: introPop 0.9s ease forwards; }
@keyframes introPop {
  0% { opacity: 0; transform: scale(0.4); }
  25% { opacity: 1; transform: scale(1.12); }
  80% { opacity: 1; transform: scale(1); }
  100% { opacity: 1; transform: scale(1); }
}
#introSkip { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 100%; text-align: center; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255, 190, 225, 0.55); }

/* ---------- Make a wish / blow ---------- */
#blowBtn {
  position: fixed; bottom: calc(94px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  z-index: 20; font-family: inherit; font-size: 18px; padding: 13px 30px; border: none; border-radius: 50px;
  color: #3a1200; font-weight: bold; background: linear-gradient(135deg, #ffe08a, #e0a526, #ffd45c);
  box-shadow: 0 0 22px rgba(255, 200, 80, 0.75); opacity: 0; pointer-events: none; transition: opacity 1s ease; white-space: nowrap;
}
#blowBtn.show { opacity: 1; pointer-events: auto; }
#blowHint {
  position: fixed; left: 0; width: 100%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  text-align: center; padding: 0 20px; font-size: 20px; line-height: 1.5; font-style: italic; color: #ffe9a8;
  text-shadow: 0 0 14px rgba(255, 160, 60, 0.8); opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
}
#blowHint small { font-size: 14px; color: #ffd9e8; font-style: normal; }
#blowHint.show { opacity: 1; }

/* ---------- Fireworks ---------- */
#fireworks { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 65; pointer-events: none; }

/* ---------- Balloons ---------- */
#balloons { position: fixed; inset: 0; z-index: 66; pointer-events: none; overflow: hidden; }
.balloon {
  position: absolute; bottom: -120px; width: 54px; height: 68px; border-radius: 50% 50% 48% 48%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.7), var(--c) 45%);
  box-shadow: inset -6px -8px 14px rgba(0,0,0,0.18); pointer-events: auto;
  animation: balloonUp linear forwards, balloonSway ease-in-out infinite alternate;
}
.balloon::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -5px; border: 5px solid transparent; border-bottom: 8px solid var(--c); border-top: 0; }
.bstring { position: absolute; left: 50%; top: 100%; width: 1px; height: 46px; background: rgba(255,255,255,0.6); }
@keyframes balloonUp { to { bottom: 112vh; } }
@keyframes balloonSway { from { transform: translateX(calc(var(--sway) * -1)); } to { transform: translateX(var(--sway)); } }
.bpiece { position: fixed; width: 8px; height: 8px; border-radius: 50%; z-index: 67; pointer-events: none; animation: bpiece 0.6s ease-out forwards; }
@keyframes bpiece { to { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; } }

/* ---------- Tap-the-slice popups ---------- */
.yum { position: fixed; z-index: 75; pointer-events: none; transform: translate(-50%, -50%); font-size: 22px; font-weight: bold; color: #ffe9a8; text-shadow: 0 0 10px #ff4f93; animation: yumUp 1.4s ease-out forwards; white-space: nowrap; }
@keyframes yumUp { to { transform: translate(-50%, -140px); opacity: 0; } }

/* ---------- Memories ---------- */
#memBtn {
  position: fixed; bottom: calc(94px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  z-index: 20; font-family: inherit; font-size: 18px; padding: 13px 30px; border: none; border-radius: 50px;
  color: #fff; font-weight: bold; background: linear-gradient(135deg, #ff7eb6, #e0306f, #ff5a9a);
  box-shadow: 0 0 22px rgba(255, 90, 150, 0.75); opacity: 0; pointer-events: none; transition: opacity 1s ease; white-space: nowrap;
}
#memBtn.show { opacity: 1; pointer-events: auto; }
#memories { position: fixed; inset: 0; z-index: 90; background: radial-gradient(ellipse at 50% 40%, #1b1040 0%, #07020b 80%); animation: fadeIn 0.8s ease; overflow: hidden; }
.mstars { position: absolute; inset: 0; width: 100%; height: 100%; }
.mclose { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 5; width: 44px; height: 44px; border: none; border-radius: 50%; font-size: 18px; color: #fff; background: rgba(255,255,255,0.16); }
.mstage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 2; }
.mcard { width: 170px; height: 230px; background: #fff; border-radius: 6px; color: #d11a5a; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(255,255,255,0.5); animation: cardFloat 2.6s ease-in-out infinite; }
.mcard p { margin-top: 14px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #a3204f; }
.mheart { font-size: 54px; animation: beat 1s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.18); } }
@keyframes cardFloat { 50% { transform: translateY(-8px); } }
.mslides { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 0 20px; }
.polaroid { background: #fff; padding: 12px 12px 8px; border-radius: 4px; box-shadow: 0 0 40px rgba(255,160,200,0.45); max-width: 92vw; touch-action: pan-y; }
.polaroid img { display: block; max-width: calc(92vw - 24px); max-height: 58vh; border-radius: 2px; }
.polaroid.swap { animation: swapIn 0.7s ease; }
@keyframes swapIn { from { opacity: 0; transform: translateX(30px) rotate(2deg); } to { opacity: 1; transform: none; } }
.mcap { min-height: 30px; padding-top: 8px; text-align: center; font-style: italic; font-size: 17px; color: #7a1a40; }
.mnav { margin-top: 18px; display: flex; align-items: center; gap: 18px; color: #ffd9e8; }
.mnav button { width: 44px; height: 44px; border: none; border-radius: 50%; font-size: 26px; color: #fff; background: rgba(255,255,255,0.16); }
.mall { margin-top: 16px; font-family: inherit; font-size: 16px; padding: 10px 28px; border: none; border-radius: 40px; color: #3a1200; font-weight: bold; background: linear-gradient(135deg, #ffe08a, #e0a526); }
.mheartwrap { width: 0; height: 0; perspective: 900px; }
.mheartspin { position: relative; transform-style: preserve-3d; animation: heartSway 9s ease-in-out infinite; }
@keyframes heartSway { 0%,100% { transform: rotateY(-38deg); } 50% { transform: rotateY(38deg); } }
.htile { position: absolute; left: 0; top: 0; object-fit: cover; margin: -20px 0 0 -20px; border: 3px solid #fff; border-radius: 3px; box-shadow: 0 0 12px rgba(255,120,180,0.8); transform: translate(var(--x), var(--y)); animation: tileIn 0.8s ease backwards; animation-delay: var(--d); }
@keyframes tileIn { from { opacity: 0; transform: translate(0, 0) scale(0.2); } }
.mfoot { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 100%; text-align: center; font-style: italic; font-size: 18px; color: #ffd9e8; }

/* ---------- Intro character ---------- */
#intro.charscene { background: radial-gradient(ellipse at 50% 45%, #2a0f45 0%, #07020b 75%); }
#intro.charscene #introRain { opacity: 0; transition: opacity 0.6s ease; }
#introChar { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.6s ease; }
.cbob { animation: cbob 1.1s ease-in-out infinite; transform-origin: 100px 200px; }
@keyframes cbob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
.fl { animation: cfl 0.5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
@keyframes cfl { to { transform: scale(0.8, 1.15); } }
.cbanner { margin-top: 16px; padding: 8px 20px; border-radius: 8px; font-family: 'Trebuchet MS', Arial, sans-serif; font-weight: 800; letter-spacing: 3px; font-size: 20px; color: #3a1200; background: linear-gradient(135deg, #ffe08a, #e0a526); box-shadow: 0 0 22px rgba(255, 200, 80, 0.7); }

/* ---------- Title above the cake ---------- */
#cakeTitle { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); left: 0; width: 100%; z-index: 15; text-align: center; padding: 0 70px; font-style: italic; font-size: clamp(22px, 6.5vw, 34px); color: #ffe9a8; text-shadow: 0 0 14px #ff9ec4, 0 0 30px #ff4f93; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
#cakeTitle.show { opacity: 1; }

/* ---------- Memories v2 (card, note box, pairs, glowing heart) ---------- */
.mcard { position: relative; transform-origin: center; }
.mcard svg { margin-top: 6px; }
.mcard.opening { animation: cardOpen 0.65s ease forwards; }
@keyframes cardOpen { to { transform: perspective(700px) rotateY(-80deg) scale(1.1); opacity: 0; } }
.mnote { width: min(92vw, 420px); padding: 14px 18px; border-radius: 10px; background: #fff; color: #8a1d4a; text-align: center; font-style: italic; font-size: 17px; line-height: 1.5; box-shadow: 0 0 30px rgba(255,160,200,0.4); }
.mnote::after { content: '\2665'; color: #ff4f93; margin-left: 8px; }
.mpair { margin-top: 14px; display: flex; gap: 6px; justify-content: center; width: min(92vw, 420px); }
.mpair img { flex: 1; min-width: 0; max-height: 52vh; object-fit: cover; border: 4px solid #fff; border-radius: 3px; box-shadow: 0 0 24px rgba(255,160,200,0.4); }
.mpair.single img { max-width: 70%; flex: 0 1 auto; }
.mnote.swap, .mpair.swap { animation: swapIn 0.7s ease; }
.mslides.folding { animation: foldShut 0.9s ease forwards; }
@keyframes foldShut { 60% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(0.05) rotateY(90deg); opacity: 0; } }
.htile { border: 3px solid #fff; border-radius: 4px; box-shadow: 0 0 10px #ff6fb0, 0 0 22px rgba(255,90,170,0.7); transform: translate(var(--x), var(--y)) rotate(var(--r)); animation: tileFly 1.1s cubic-bezier(.2,.9,.3,1.1) backwards; animation-delay: var(--d); }
@keyframes tileFly { from { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0.1); } 30% { opacity: 1; } }
.mheartspin { animation: heartSway 8s ease-in-out infinite; }
@keyframes heartSway { 0%,100% { transform: rotateY(-30deg); } 50% { transform: rotateY(30deg); } }
.mfoot { text-shadow: 0 0 14px #ff4f93; font-size: 22px; }

/* ---------- Rose bouquet ---------- */
#roses { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #3a0f33 0%, #12041a 80%); animation: fadeIn 0.9s ease; transition: opacity 0.7s ease; }
#roses.bye { opacity: 0; }
.rosebox { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
.rosebox h2 { font-size: 30px; font-style: italic; font-weight: normal; color: #ffe9a8; margin-bottom: 8px; animation: glowPulse 3s ease-in-out infinite; }
.rosebox svg { animation: roseIn 1.4s cubic-bezier(.2,.9,.3,1.2) backwards; filter: drop-shadow(0 0 22px rgba(255, 80, 140, 0.5)); }
@keyframes roseIn { from { transform: translateY(80px) scale(0.5); opacity: 0; } }
.rosebox p { margin: 10px 0 4px; font-size: 17px; line-height: 1.6; color: #ffd9e8; max-width: 300px; font-style: italic; }
.rosebox button { margin-top: 14px; font-family: inherit; font-size: 17px; padding: 11px 30px; border: none; border-radius: 40px; color: #3a1200; font-weight: bold; background: linear-gradient(135deg, #ffe08a, #e0a526); }
.petal { position: absolute; top: -30px; width: var(--s); height: calc(var(--s) * 1.3); border-radius: 80% 0 80% 0; background: linear-gradient(135deg, #ff5f9a, #d90f3c); opacity: 0.85; animation: petalFall linear infinite; z-index: 1; }
@keyframes petalFall { to { transform: translate(60px, 110vh) rotate(540deg); } }

</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="hearts"></div>

<div id="welcome">
  <div class="welcome-box">
    <p class="small">A special surprise for</p>
    <h1 class="glow-title">Shalu</h1>
    <p class="sub">Someone very special made something just for you ❤️</p>
    <button id="openBtn">Open Surprise 🎁</button>
  </div>
</div>

<div id="reveal" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="js/three.min.js"><\/script>');</script>
<script>
/* ---- cake.js ---- */
(function () {
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.localClippingEnabled = true;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const d = Math.max(10, 3.1 / (halfFov * camera.aspect));
    camera.position.set(0, d * 0.3 + 1.2, d);
    camera.lookAt(0, 2.9, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Lights ----------
  scene.add(new THREE.HemisphereLight(0xfff1e0, 0x3a1030, 0.9));
  const key = new THREE.DirectionalLight(0xfff0d8, 1.1);
  key.position.set(4, 8, 6);
  scene.add(key);
  const rim = new THREE.PointLight(0xff7eb6, 0.9, 30);
  rim.position.set(-6, 4, -4);
  scene.add(rim);
  const warm = new THREE.PointLight(0xffc766, 0.9, 20);
  warm.position.set(0, 6, 3);
  scene.add(warm);

  // ---------- Materials ----------
  const M = {
    milk:  new THREE.MeshStandardMaterial({ color: 0xf4a3c0, roughness: 0.42, metalness: 0.05 }),
    dark:  new THREE.MeshStandardMaterial({ color: 0xc2255c, roughness: 0.25, metalness: 0.1 }),
    cream: new THREE.MeshStandardMaterial({ color: 0xfff1e6, roughness: 0.6 }),
    white: new THREE.MeshStandardMaterial({ color: 0xfff8f2, roughness: 0.4 }),
    gold:  new THREE.MeshStandardMaterial({ color: 0xf2c14e, roughness: 0.3, metalness: 0.7, emissive: 0x3a2800 }),
    pink2: new THREE.MeshStandardMaterial({ color: 0xf9c6d8, roughness: 0.42, metalness: 0.05 }),
    pink3: new THREE.MeshStandardMaterial({ color: 0xfde3ec, roughness: 0.42, metalness: 0.05 }),
    berry: new THREE.MeshStandardMaterial({ color: 0xd90f3c, roughness: 0.3, metalness: 0.1 }),
    leaf:  new THREE.MeshStandardMaterial({ color: 0x2e8b3d, roughness: 0.6 })
  };

  // ---------- Helpers ----------
  let seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  function mesh(geo, mat, x, y, z) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    return m;
  }

  function ring(group, count, radius, y, size, mat) {
    const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(size, 10, 8), mat, count);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      dummy.position.set(Math.cos(a) * radius, y, Math.sin(a) * radius);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    group.add(inst);
  }

  // ---------- Cake stand ----------
  const stand = new THREE.Group();
  stand.add(mesh(new THREE.CylinderGeometry(2.8, 2.75, 0.12, 64), M.gold, 0, 0.06, 0));
  stand.add(mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.03, 64), M.cream, 0, 0.125, 0));
  stand.add(mesh(new THREE.CylinderGeometry(0.4, 0.7, 0.6, 24), M.gold, 0, -0.3, 0));
  stand.add(mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.1, 48), M.gold, 0, -0.65, 0));
  ring(stand, 72, 2.72, 0.12, 0.05, M.cream);

  // ---------- One cake layer ----------
  function buildLayer(radius, y0, height, dripCount, topBeads, bodyMat) {
    const g = new THREE.Group();
    const top = y0 + height;
    g.add(mesh(new THREE.CylinderGeometry(radius, radius, height, 56), bodyMat || M.milk, 0, y0 + height / 2, 0));
    g.add(mesh(new THREE.CylinderGeometry(radius + 0.02, radius + 0.02, 0.1, 56), M.cream, 0, y0 + 0.05, 0));
    g.add(mesh(new THREE.CylinderGeometry(radius + 0.04, radius + 0.04, 0.08, 56), M.dark, 0, top + 0.04, 0));
    const rope = mesh(new THREE.TorusGeometry(radius + 0.03, 0.07, 10, 56), M.dark, 0, top + 0.07, 0);
    rope.rotation.x = Math.PI / 2;
    g.add(rope);
    g.add(mesh(new THREE.CylinderGeometry(radius + 0.015, radius + 0.015, 0.04, 56), M.gold, 0, y0 + 0.17, 0));
    ring(g, Math.round(radius * 18), radius + 0.09, y0 + 0.1, 0.055, M.gold);
    if (topBeads) {
      ring(g, Math.round(radius * 14), radius - 0.14, top + 0.12, 0.045, M.gold);
    }
    for (let i = 0; i < dripCount; i++) {
      const a = ((i + rnd() * 0.6) / dripCount) * Math.PI * 2;
      const len = 0.22 + rnd() * 0.38;
      const w = 0.065 + rnd() * 0.04;
      const x = Math.cos(a) * (radius + 0.03);
      const z = Math.sin(a) * (radius + 0.03);
      g.add(mesh(new THREE.CylinderGeometry(w, w, len, 10), M.dark, x, top - len / 2 + 0.05, z));
      g.add(mesh(new THREE.SphereGeometry(w * 1.25, 10, 8), M.dark, x, top - len + 0.05, z));
    }
    return g;
  }

  // ---------- Chocolate curls, shavings, gold flakes ----------
  const chocoMats = [M.milk, M.dark, M.white];
  const curlGeo = new THREE.TorusGeometry(0.13, 0.036, 8, 18, Math.PI * 1.5);
  const shaveGeo = new THREE.BoxGeometry(0.22, 0.012, 0.07);
  const flakeGeo = new THREE.BoxGeometry(0.07, 0.01, 0.07);

  function decorate(g, rMin, rMax, y, nCurls, nShaves, nFlakes) {
    let i, a, r, m;
    for (i = 0; i < nCurls; i++) {
      a = rnd() * Math.PI * 2;
      r = rMin + rnd() * (rMax - rMin);
      m = mesh(curlGeo, chocoMats[Math.floor(rnd() * 3)], Math.cos(a) * r, y + 0.1, Math.sin(a) * r);
      m.rotation.set(rnd() * 3, rnd() * 6.28, rnd() * 3);
      m.scale.setScalar(0.8 + rnd() * 0.5);
      g.add(m);
    }
    for (i = 0; i < nShaves; i++) {
      a = rnd() * Math.PI * 2;
      r = rMin + rnd() * (rMax - rMin);
      m = mesh(shaveGeo, chocoMats[Math.floor(rnd() * 3)], Math.cos(a) * r, y + 0.02 + rnd() * 0.03, Math.sin(a) * r);
      m.rotation.set((rnd() - 0.5) * 0.6, rnd() * 6.28, (rnd() - 0.5) * 0.6);
      g.add(m);
    }
    for (i = 0; i < nFlakes; i++) {
      a = rnd() * Math.PI * 2;
      r = rMin + rnd() * (rMax - rMin);
      m = mesh(flakeGeo, M.gold, Math.cos(a) * r, y + 0.03, Math.sin(a) * r);
      m.rotation.set((rnd() - 0.5) * 0.5, rnd() * 6.28, (rnd() - 0.5) * 0.5);
      g.add(m);
    }
  }

  // ---------- Assemble the cake ----------
  const cake = new THREE.Group();
  scene.add(cake);

  const L1 = buildLayer(2.05, 0.14, 0.95, 26, false, M.milk);
  const L2 = buildLayer(1.6, 1.17, 0.85, 21, false, M.pink2);
  const L3 = buildLayer(1.15, 2.1, 0.75, 16, true, M.pink3);

  decorate(L1, 1.72, 1.95, 1.17, 9, 22, 14);
  decorate(L2, 1.27, 1.5, 2.1, 7, 16, 10);
  decorate(L3, 0.55, 0.88, 2.93, 6, 12, 8);
  decorate(stand, 2.2, 2.5, 0.14, 4, 14, 6);

  // ---------- Strawberries and cream dollops ----------
  const berryGeo = new THREE.SphereGeometry(0.12, 14, 12);
  const leafGeo = new THREE.ConeGeometry(0.075, 0.05, 6);
  const dollopGeo = new THREE.SphereGeometry(0.09, 12, 10);
  const pearlGeo = new THREE.SphereGeometry(0.03, 8, 6);
  function berries(g, count, radius, y, offset) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + (offset || 0);
      const x = Math.cos(a) * radius;
      const z = Math.sin(a) * radius;
      const b = mesh(berryGeo, M.berry, x, y + 0.12, z);
      b.scale.set(1, 1.2, 1);
      g.add(b);
      g.add(mesh(leafGeo, M.leaf, x, y + 0.27, z));
      const a2 = a + Math.PI / count;
      const d = mesh(dollopGeo, M.white, Math.cos(a2) * radius, y + 0.07, Math.sin(a2) * radius);
      d.scale.set(1, 0.8, 1);
      g.add(d);
      g.add(mesh(pearlGeo, M.gold, Math.cos(a2) * radius, y + 0.17, Math.sin(a2) * radius));
    }
  }
  berries(L1, 10, 1.88, 1.17, 0.2);
  berries(L2, 8, 1.43, 2.1, 0.4);
  berries(L3, 6, 0.93, 2.93, 0.5);


  // ---------- Reveal animation ----------
  const parts = [stand, L1, L2, L3];
  parts.forEach(function (p) { cake.add(p); p.visible = false; });

  let startTime = null;
  let last = performance.now();
  window.CAKE = { stand: stand, freeze: false, camera: camera, renderer: renderer, THREE: THREE, scene: scene, cake: cake, L1: L1, L2: L2, L3: L3, M: M }; window.cakeHooks = []; window.startCake = function () { startTime = performance.now(); };

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
    last = now;
    if (startTime !== null) {
      const t = (now - startTime) / 1000;
      parts.forEach(function (p, i) {
        const k = Math.min(Math.max((t - i * 0.5) / 1.0, 0), 1);
        p.visible = k > 0;
        p.position.y = (1 - easeOutBack(k)) * 5;
      });
      if (!window.CAKE.freeze) cake.rotation.y += dt * (0.3 + Math.max(0, 3 - t) * 0.5);
    }
    window.cakeHooks.forEach(function (f) { f(now, dt); }); renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
})();

</script>
<script>
/* ---- candles.js ---- */
(function () {
  const C = window.CAKE;
  const THREE = C.THREE;

  // ---------- Golden lettering ribbon on the middle layer ----------
  const W = 2048, H = 96;
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#a3204f';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e8b53a';
  ctx.fillRect(0, 3, W, 4);
  ctx.fillRect(0, H - 7, W, 4);
  ctx.fillStyle = '#e8c06a';
  ctx.fillRect(0, 9, W, 1);
  ctx.fillRect(0, H - 10, W, 1);

  const msg = 'Happy Birthday Shalu 😘';
  let size = 70;
  ctx.font = 'italic bold ' + size + 'px Georgia, serif';
  const tw = ctx.measureText(msg).width;
  if (tw > 940) {
    size = Math.floor(size * 940 / tw);
    ctx.font = 'italic bold ' + size + 'px Georgia, serif';
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  [512, 1536].forEach(function (cx) {
    const g = ctx.createLinearGradient(0, 20, 0, 76);
    g.addColorStop(0, '#fff3b8');
    g.addColorStop(0.5, '#f4c542');
    g.addColorStop(1, '#b8821a');
    ctx.shadowColor = 'rgba(255, 205, 90, 0.9)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = g;
    ctx.fillText(msg, cx, H / 2 + 2);
  });
  ctx.shadowBlur = 0;

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const rMid = 1.66;
  const hRib = 2 * Math.PI * rMid * H / W;
  const ribMat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.45, metalness: 0.15,
    emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.35
  });
  const rib = new THREE.Mesh(new THREE.CylinderGeometry(rMid, rMid, hRib, 96, 1, true), ribMat);
  rib.position.y = 1.55;
  C.L2.add(rib);

  // ---------- Flame and glow textures ----------
  function flameTexture() {
    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 128;
    const g = c.getContext('2d');
    g.shadowColor = 'rgba(255, 160, 40, 0.9)';
    g.shadowBlur = 12;
    g.beginPath();
    g.moveTo(32, 10);
    g.bezierCurveTo(50, 46, 54, 84, 32, 110);
    g.bezierCurveTo(10, 84, 14, 46, 32, 10);
    g.closePath();
    const gr = g.createRadialGradient(32, 96, 2, 32, 84, 44);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.35, '#ffe27a');
    gr.addColorStop(0.75, '#ff9a2a');
    gr.addColorStop(1, '#ff5a00');
    g.fillStyle = gr;
    g.fill();
    return new THREE.CanvasTexture(c);
  }

  function glowTexture() {
    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255, 200, 100, 0.65)');
    gr.addColorStop(0.4, 'rgba(255, 150, 60, 0.25)');
    gr.addColorStop(1, 'rgba(255, 120, 40, 0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }

  const fTex = flameTexture();
  const gTex = glowTexture();

  // ---------- Candles ----------
  const flames = [];
  const colors = [0xfff1e0, 0xff9ec4, 0xf2c14e, 0xffffff, 0xff9ec4];
  const N = 5;
  const R = 0.5;
  const BASE = 2.93;
  const wickTop = 0.72;
  const wickMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + 0.3;
    const cg = new THREE.Group();
    cg.position.set(Math.cos(a) * R, BASE, Math.sin(a) * R);
    cg.userData.noClip = true;

    const holder = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.05, 20), C.M.gold);
    holder.position.y = 0.025;
    cg.add(holder);

    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, 0.6, 16),
      new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.5 })
    );
    body.position.y = 0.35;
    cg.add(body);

    [0.22, 0.48].forEach(function (y) {
      const r = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.012, 8, 20), C.M.gold);
      r.rotation.x = Math.PI / 2;
      r.position.y = y;
      cg.add(r);
    });

    const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.08, 6), wickMat);
    wick.position.y = 0.68;
    cg.add(wick);

    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: gTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    glow.scale.set(0.55, 0.55, 1);
    glow.position.y = 0.85;
    cg.add(glow);

    const flame = new THREE.Sprite(new THREE.SpriteMaterial({
      map: fTex, transparent: true, depthWrite: false
    }));
    flame.scale.set(0.15, 0.3, 1);
    flame.position.y = wickTop + 0.36 * 0.3;
    cg.add(flame);

    flames.push({ flame: flame, glow: glow, ph: i * 1.7, group: cg, out: false });
    C.L3.add(cg);
  }

  // ---------- Warm candle light ----------
  const candleLight = new THREE.PointLight(0xffb454, 1.0, 7);
  candleLight.position.set(0, 3.8, 0);
  C.L3.add(candleLight);

  C.candles = flames;
  C.candleK = 1;

  // ---------- Flicker ----------
  window.cakeHooks.push(function (now) {
    const t = now / 1000;
    flames.forEach(function (f) {
      if (f.out) { f.flame.visible = false; f.glow.visible = false; return; }
      const k = 1 + Math.sin(t * 11 + f.ph) * 0.07 + Math.sin(t * 23 + f.ph * 2) * 0.05;
      const h = 0.3 * k;
      f.flame.scale.set(0.15 * (2 - k), h, 1);
      f.flame.position.y = wickTop + 0.36 * h;
      f.flame.position.x = Math.sin(t * 7 + f.ph) * 0.01;
      f.glow.material.opacity = 0.8 + Math.sin(t * 9 + f.ph) * 0.2;
    });
    candleLight.intensity = (0.9 + Math.sin(t * 10) * 0.15 + Math.sin(t * 17) * 0.1) * (C.candleK === undefined ? 1 : C.candleK);
  });
})();

</script>

<script>
/* ---- intro.js ---- */
// Opening sequence: pink digital rain -> 3, 2, 1 -> BIRTHDAY TO <NAME> -> heart -> welcome screen.
// Tap anywhere to skip. Change the name in message.js (window.SHALU_NAME).
(function () {
  const name = String(window.SHALU_NAME || 'Shalu').toUpperCase();
  const WORDS = ['3', '2', '1', 'BIRTHDAY', 'TO', name, '♥'];
  const RAIN_FIRST = 1800;   // ms of rain before the first word
  const STEP = 950;          // ms per word
  const HOLD_END = 900;      // ms to hold the heart before fading out

  const box = document.createElement('div');
  box.id = 'intro';
  box.innerHTML = '<canvas id="introRain"></canvas><div id="introWord"></div><div id="introSkip">tap to skip</div>';
  document.body.appendChild(box);

  const cv = document.getElementById('introRain');
  const ctx = cv.getContext('2d');
  const wordEl = document.getElementById('introWord');
  const CELL = 14;
  let cols = 0, drops = [], rafId = 0, done = false, last = 0;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(window.innerWidth * dpr);
    cv.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(window.innerWidth / CELL);
    drops = [];
    for (let i = 0; i < cols; i++) drops.push(Math.random() * -40);
  }
  size();
  window.addEventListener('resize', size);

  function rain(now) {
    if (done) return;
    rafId = requestAnimationFrame(rain);
    if (now - last < 55) return;
    last = now;
    ctx.fillStyle = 'rgba(12, 2, 20, 0.16)';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i < cols; i++) {
      const x = i * CELL + CELL / 2;
      const y = drops[i] * CELL;
      ctx.fillStyle = '#ffd1e8';
      ctx.fillText(Math.random() < 0.5 ? '1' : '0', x, y);
      ctx.fillStyle = 'rgba(255, 60, 160, 0.85)';
      ctx.fillText(Math.random() < 0.5 ? '1' : '0', x, y - CELL);
      if (y > window.innerHeight && Math.random() > 0.96) drops[i] = 0;
      drops[i] += 1;
    }
  }
  ctx.fillStyle = '#0c0214';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  rafId = requestAnimationFrame(rain);

  const timers = [];
  function showWord(w, i) {
    wordEl.className = '';
    void wordEl.offsetWidth;
    wordEl.textContent = w;
    wordEl.className = 'pop' + (w === '♥' ? ' heartword' : '') + (w.length > 5 ? ' longword' : '');
  }
  WORDS.forEach(function (w, i) {
    timers.push(setTimeout(function () { showWord(w, i); }, RAIN_FIRST + i * STEP));
  });
  const CHAR_AT = RAIN_FIRST + WORDS.length * STEP;
  const CHAR_MS = 2600;
  timers.push(setTimeout(function () {
    wordEl.className = '';
    wordEl.textContent = '';
    box.classList.add('charscene');
    const c = document.createElement('div');
    c.id = 'introChar';
    c.innerHTML =
      '<svg viewBox="0 0 200 230" width="190" height="218" aria-hidden="true">' +
      '<g class="cbob">' +
      '<rect x="62" y="30" width="8" height="30" rx="3" fill="#ffd45c"/><rect x="96" y="22" width="8" height="38" rx="3" fill="#7fd6ff"/><rect x="130" y="30" width="8" height="30" rx="3" fill="#ff8ab8"/>' +
      '<ellipse class="fl" cx="66" cy="24" rx="6" ry="10" fill="#ffb02e"/><ellipse class="fl" cx="100" cy="16" rx="6" ry="10" fill="#ffb02e"/><ellipse class="fl" cx="134" cy="24" rx="6" ry="10" fill="#ffb02e"/>' +
      '<rect x="40" y="58" width="120" height="30" rx="12" fill="#ffb3d1"/><path d="M40 70q10 14 20 0t20 0 20 0 20 0 20 0 20 0" fill="#fff" />' +
      '<rect x="28" y="88" width="144" height="74" rx="16" fill="#ff6fa8"/>' +
      '<circle cx="78" cy="122" r="6" fill="#3a0f33"/><circle cx="122" cy="122" r="6" fill="#3a0f33"/>' +
      '<circle cx="66" cy="138" r="8" fill="#ff9ec4" opacity=".8"/><circle cx="134" cy="138" r="8" fill="#ff9ec4" opacity=".8"/>' +
      '<path d="M88 134q12 14 24 0" stroke="#3a0f33" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<rect x="20" y="162" width="160" height="14" rx="7" fill="#e8b53a"/>' +
      '</g></svg><div class="cbanner">HAPPY BIRTHDAY</div>';
    box.appendChild(c);
  }, CHAR_AT));
  const total = CHAR_AT + CHAR_MS;
  timers.push(setTimeout(finish, total));

  function finish() {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    box.classList.add('leaving');
    setTimeout(function () {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', size);
      box.remove();
    }, 1300);
  }
  box.addEventListener('click', finish);
})();

</script>
<script>
/* ---- blow.js ---- */
// Make a wish and blow out the candles (microphone blow, or just tap). Then the cut button appears.
(function () {
  const C = window.CAKE;
  const THREE = C.THREE;
  C.needBlow = true;       // tells cut.js to wait for us

  let phase = 'idle';      // idle -> waiting -> out
  let readyAt = 0;
  const smokes = [];

  const btn = document.createElement('button');
  btn.id = 'blowBtn';
  btn.textContent = '🕯️ Make a wish';
  document.body.appendChild(btn);

  const hint = document.createElement('div');
  hint.id = 'blowHint';
  document.body.appendChild(hint);

  function say(html, ms) {
    hint.innerHTML = html;
    hint.classList.add('show');
    if (ms) setTimeout(function () { hint.classList.remove('show'); }, ms);
  }

  // ---------- smoke ----------
  function smokeTex() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(220,220,230,0.7)');
    gr.addColorStop(1, 'rgba(220,220,230,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const sTex = smokeTex();

  function puff(f) {
    for (let i = 0; i < 4; i++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: sTex, transparent: true, depthWrite: false, opacity: 0 }));
      sp.scale.set(0.12, 0.12, 1);
      sp.position.set(0, 0.8, 0);
      f.group.add(sp);
      smokes.push({ sp: sp, born: performance.now() + i * 140, dx: (Math.random() - 0.5) * 0.25 });
    }
  }

  window.cakeHooks.push(function (now) {
    for (let i = smokes.length - 1; i >= 0; i--) {
      const s = smokes[i];
      const k = (now - s.born) / 1800;
      if (k < 0) continue;
      if (k >= 1) { s.sp.parent.remove(s.sp); s.sp.material.dispose(); smokes.splice(i, 1); continue; }
      s.sp.position.set(Math.sin(k * 5) * 0.05 + s.dx * k, 0.8 + k * 0.9, 0);
      const sc = 0.12 + k * 0.5;
      s.sp.scale.set(sc, sc, 1);
      s.sp.material.opacity = Math.sin(k * Math.PI) * 0.55;
    }
    if (phase === 'out' && C.candleK > 0.12) C.candleK = Math.max(0.12, C.candleK - 0.02);
  });

  // ---------- microphone ----------
  let stream = null, actx = null, micTimer = 0;
  function listen() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } }).then(function (s) {
      if (phase !== 'waiting') { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s;
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      const an = actx.createAnalyser();
      an.fftSize = 512;
      actx.createMediaStreamSource(s).connect(an);
      const buf = new Float32Array(an.fftSize);
      const t0 = performance.now();
      let ambient = 0, n = 0, loud = 0;
      say('Blow into your mic 💨<br><small>or tap the cake</small>');
      micTimer = setInterval(function () {
        an.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.sqrt(sum / buf.length);
        if (performance.now() - t0 < 700) { ambient += rms; n++; return; }
        const thr = Math.max(0.08, (ambient / Math.max(n, 1)) * 3.5);
        loud = rms > thr ? loud + 1 : Math.max(0, loud - 1);
        if (loud >= 5) blow();
      }, 50);
    }).catch(function () {
      say('Tap the cake to blow 💨');
    });
  }
  function stopMic() {
    clearInterval(micTimer);
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    if (actx && actx.close) actx.close().catch(function () {});
    stream = actx = null;
  }

  // ---------- the blow ----------
  function blow() {
    if (phase !== 'waiting') return;
    phase = 'out';
    stopMic();
    hint.classList.remove('show');
    C.candles.forEach(function (f, i) {
      setTimeout(function () { f.out = true; puff(f); }, i * 170);
    });
    setTimeout(function () {
      say('Wish made ✨<br><small>I hope it comes true ❤️</small>');
    }, 1200);
    setTimeout(function () {
      hint.classList.remove('show');
      if (window.showCutBtn) window.showCutBtn();
    }, 3800);
  }

  btn.addEventListener('click', function () {
    if (phase !== 'idle') return;
    phase = 'waiting';
    readyAt = performance.now() + 500;
    btn.classList.remove('show');
    say('Close your eyes and make a wish… 🙏<br><small>then blow (mic) or tap the cake</small>');
    listen();
  });

  window.addEventListener('click', function (e) {
    if (phase !== 'waiting' || performance.now() < readyAt) return;
    if (C.dragged) return;
    if (e.target.closest && e.target.closest('button')) return;
    blow();
  });

  const title = document.createElement('div');
  title.id = 'cakeTitle';
  title.textContent = window.SHALU_TITLE || 'Happy Birthday!';
  document.body.appendChild(title);

  const prev = window.startCake;
  window.startCake = function () {
    if (prev) prev();
    setTimeout(function () { title.classList.add('show'); }, 2200);
    setTimeout(function () { if (phase === 'idle') btn.classList.add('show'); }, 6500);
  };
})();

</script>
<script>
/* ---- cut.js ---- */
(function () {
  const C = window.CAKE;
  const THREE = C.THREE;

  // ---------- Settings you can tweak ----------
  const HALF = 0.3;                    // half-width of the slice in radians (0.3 = about 17 degrees)
  const SLIDE_OUT = 1.4;               // how far the slice slides toward you
  const GAP = 0.3 + Math.PI / 5;       // the gap between two candles (see candles.js)
  const TARGET = GAP - Math.PI / 2;    // cake rotation that puts that gap in front
  const FAR = 1000;                    // "switched off" value for the clipping planes

  // The slice is a wedge pointing at the camera (+z). Two vertical planes define it.
  const n1 = new THREE.Vector3(-Math.cos(HALF), 0, Math.sin(HALF));
  const n2 = new THREE.Vector3(Math.cos(HALF), 0, Math.sin(HALF));
  const e1 = new THREE.Vector3(Math.sin(HALF), 0, Math.cos(HALF));
  const e2 = new THREE.Vector3(-Math.sin(HALF), 0, Math.cos(HALF));
  const mainPlanes = [new THREE.Plane(n1.clone().negate(), FAR), new THREE.Plane(n2.clone().negate(), FAR)];
  const slicePlanes = [new THREE.Plane(n1.clone(), 0), new THREE.Plane(n2.clone(), 0)];

  const LAYERS = [
    { r: 2.05, y0: 0.14, h: 0.95 },
    { r: 1.6, y0: 1.17, h: 0.85 },
    { r: 1.15, y0: 2.1, h: 0.75 }
  ];

  function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  let prepared = false, running = false, released = false, confettiDone = false, giftShown = false;
  let T0 = 0, r0 = 0, rT = 0;
  let sliceWorld, sliceRoot, capsMain, capsSlice, knife;

  // ---------- Buttons and message box ----------
  const cutBtn = document.createElement('button');
  cutBtn.id = 'cutBtn';
  cutBtn.textContent = '🔪 Cut the cake';
  document.body.appendChild(cutBtn);

  const gift = document.createElement('div');
  gift.id = 'gift';
  document.body.appendChild(gift);

  function showMsgBtn(on) {
    const b = document.getElementById('msgBtn');
    if (b) b.style.display = on ? '' : 'none';
  }

  function showGift() {
    const lines = window.SHALU_GIFT || ['Your gift is waiting! 🎁'];
    let html = '<div class="letter-card gift-card"><h2>' + lines[0] + '</h2>';
    lines.slice(1).forEach(function (l, i) {
      html += '<p style="animation-delay:' + (0.6 + i * 1.0) + 's">' + l + '</p>';
    });
    html += '<button id="closeGift">Close ❤️</button></div>';
    gift.innerHTML = html;
    gift.classList.add('open');
    document.getElementById('closeGift').onclick = function () {
      gift.classList.remove('open');
      showMsgBtn(true);
      window.dispatchEvent(new Event('shalu:giftclosed'));
    };
  }

  // ---------- Confetti ----------
  function confetti(seconds) {
    let cv = document.getElementById('confetti');
    if (!cv) {
      cv = document.createElement('canvas');
      cv.id = 'confetti';
      document.body.appendChild(cv);
    }
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(window.innerWidth * dpr);
    cv.height = Math.floor(window.innerHeight * dpr);
    const cols = ['#ff7eb6', '#ffd45c', '#ffffff', '#ff4f93', '#9be7ff', '#c8a2ff'];
    const parts = [];
    for (let i = 0; i < 150; i++) {
      parts.push({
        x: Math.random() * cv.width,
        y: -Math.random() * cv.height * 0.7,
        vx: (Math.random() - 0.5) * 2 * dpr,
        vy: (2 + Math.random() * 4) * dpr,
        s: (6 + Math.random() * 7) * dpr,
        r: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.3,
        c: cols[i % cols.length]
      });
    }
    const start = performance.now();
    function tick(now) {
      const el = (now - start) / 1000;
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (el > seconds) return;
      parts.forEach(function (p) {
        p.x += p.vx + Math.sin(el * 3 + p.r) * 0.8 * dpr;
        p.y += p.vy;
        p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6);
        ctx.restore();
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ---------- Sponge colour for the cut faces ----------
  function spongeMaterial() {
    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#fde7b8';
    g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#ffb3cd';
    g.fillRect(0, 26, 64, 10);
    g.fillStyle = 'rgba(214, 170, 110, 0.35)';
    for (let i = 0; i < 70; i++) g.fillRect(Math.random() * 64, Math.random() * 64, 2, 2);
    return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(c), roughness: 0.9, side: THREE.DoubleSide });
  }

  function makeCaps(mat) {
    const g = new THREE.Group();
    LAYERS.forEach(function (L) {
      [[e1, n1], [e2, n2]].forEach(function (pair) {
        const e = pair[0], n = pair[1];
        const q = new THREE.Mesh(new THREE.PlaneGeometry(L.r, L.h), mat);
        q.position.set(e.x * L.r / 2, L.y0 + L.h / 2, e.z * L.r / 2);
        q.lookAt(q.position.x + n.x, q.position.y, q.position.z + n.z);
        g.add(q);
      });
    });
    return g;
  }

  function makePlate() {
    const g = new THREE.Group();
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.1, 0.07, 48), C.M.cream);
    disc.position.set(0, 0.115, 1.35);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.03, 8, 48), C.M.gold);
    rim.rotation.x = Math.PI / 2;
    rim.position.set(0, 0.15, 1.35);
    g.add(disc);
    g.add(rim);
    return g;
  }

  function makeKnife() {
    const g = new THREE.Group();
    const sh = new THREE.Shape();
    sh.moveTo(0, 0);
    sh.lineTo(2.05, 0);
    sh.lineTo(2.3, 0.4);
    sh.lineTo(2.3, 3.0);
    sh.lineTo(0, 3.0);
    sh.lineTo(0, 0);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.03, bevelEnabled: false });
    geo.translate(0, 0, -0.015);
    const steel = new THREE.MeshStandardMaterial({ color: 0xf2f4f8, metalness: 0.85, roughness: 0.2, emissive: 0x202830 });
    g.add(new THREE.Mesh(geo, steel));
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.42, 0.12), C.M.gold);
    handle.position.set(0.5, 3.21, 0);
    g.add(handle);
    const gem = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0xff3d7f, emissive: 0x550018, roughness: 0.2 })
    );
    gem.position.set(0.5, 3.21, 0.07);
    g.add(gem);
    return g;
  }

  function eachMesh(root, fn) {
    if (root.userData && root.userData.noClip) return;
    if (root.isMesh) fn(root);
    root.children.forEach(function (ch) { eachMesh(ch, fn); });
  }

  // ---------- Get everything ready (done once, before the button appears) ----------
  function prepare() {
    if (prepared) return;
    prepared = true;
    const layers = [C.L1, C.L2, C.L3];

    // a copy of the cake that will become the slice (candles and lights removed)
    sliceRoot = new THREE.Group();
    layers.forEach(function (l) { sliceRoot.add(l.clone(true)); });
    const kill = [];
    sliceRoot.traverse(function (o) {
      if ((o.userData && o.userData.noClip) || o.isLight) kill.push(o);
    });
    kill.forEach(function (o) { if (o.parent) o.parent.remove(o); });

    // clipping copies of the materials: the real cake loses the wedge, the slice keeps only the wedge
    const mainStore = new Map();
    const sliceStore = new Map();
    function pick(src, store, planes, inter) {
      let m = store.get(src);
      if (!m) {
        m = src.clone();
        m.side = THREE.DoubleSide;
        m.clippingPlanes = planes;
        m.clipIntersection = inter;
        store.set(src, m);
      }
      return m;
    }
    layers.forEach(function (l) {
      eachMesh(l, function (m) { m.material = pick(m.material, mainStore, mainPlanes, true); });
    });
    eachMesh(sliceRoot, function (m) {
      m.material = pick(m.material, sliceStore, slicePlanes, false);
      m.frustumCulled = false;
    });

    const sponge = spongeMaterial();
    capsMain = makeCaps(sponge);
    capsMain.visible = false;
    C.scene.add(capsMain);

    capsSlice = makeCaps(sponge);
    sliceWorld = new THREE.Group();
    sliceWorld.add(sliceRoot);
    sliceWorld.add(capsSlice);
    sliceWorld.add(makePlate());
    sliceWorld.visible = false;
    C.scene.add(sliceWorld);

    knife = makeKnife();
    knife.visible = false;
    C.scene.add(knife);
  }

  function setSlide(z) {
    sliceWorld.position.set(0, C.sliceHop || 0, z);
    slicePlanes[0].constant = -n1.z * z;
    slicePlanes[1].constant = -n2.z * z;
  }

  // ---------- The cutting scene ----------
  const Y_TOP = 3.9, Y_BOT = 0.2;
  const PHI1 = Math.atan2(-e1.z, e1.x);
  const PHI2 = Math.atan2(-e2.z, e2.x);

  window.cakeHooks.push(function (now) {
    if (!running) return;
    const t = (now - T0) / 1000;

    // 1) turn the cake so the gap between two candles faces you
    C.cake.rotation.y = lerp(r0, rT, easeInOut(clamp(t / 1.3, 0, 1)));

    // 2) the knife: down on the first edge, up, swing over, down on the second edge
    let show = true, ky = Y_TOP, phi = PHI1;
    if (t < 1.3) show = false;
    else if (t < 2.0) ky = lerp(Y_TOP, Y_BOT, easeInOut((t - 1.3) / 0.7));
    else if (t < 2.5) ky = lerp(Y_BOT, Y_TOP, easeInOut((t - 2.0) / 0.5));
    else if (t < 2.9) phi = lerp(PHI1, PHI2, easeInOut((t - 2.5) / 0.4));
    else if (t < 3.6) { phi = PHI2; ky = lerp(Y_TOP, Y_BOT, easeInOut((t - 2.9) / 0.7)); }
    else if (t < 4.3) { phi = PHI2; ky = lerp(Y_BOT, Y_TOP + 1.6, easeInOut((t - 3.6) / 0.7)); }
    else show = false;
    knife.visible = show;
    knife.position.set(0, ky, 0);
    knife.rotation.y = phi;

    // 3) the slice comes loose and slides out
    if (!released && t >= 3.6) {
      released = true;
      mainPlanes[0].constant = 0;
      mainPlanes[1].constant = 0;
      capsMain.visible = true;
      sliceRoot.rotation.y = C.cake.rotation.y;
      sliceWorld.visible = true;
      setSlide(0);
    }
    if (released) setSlide(SLIDE_OUT * easeOutCubic(clamp((t - 3.7) / 1.2, 0, 1)));

    // 4) confetti, then the gift message
    if (!confettiDone && t >= 4.8) { confettiDone = true; confetti(5); window.dispatchEvent(new Event('shalu:celebrate')); }
    if (t >= 5.0) C.sliceReady = true;
    if (!giftShown && t >= 6.2) { giftShown = true; showGift(); }
  });

  // ---------- Button ----------
  cutBtn.addEventListener('click', function () {
    if (running || !prepared) return;
    running = true;
    C.cutting = true;
    cutBtn.classList.remove('show');
    showMsgBtn(false);
    C.freeze = true;
    r0 = C.cake.rotation.y;
    rT = TARGET + Math.PI * 2 * Math.ceil((r0 - TARGET) / (Math.PI * 2));
    T0 = performance.now();
  });

  // lets blow.js reveal the cut button after the candles are out
  window.showCutBtn = function () { prepare(); if (!running) cutBtn.classList.add('show'); };
  C.getSliceWorld = function () { return sliceWorld; };

  const prevStart = window.startCake;
  window.startCake = function () {
    if (prevStart) prevStart();
    setTimeout(function () {
      prepare();
      if (!C.needBlow) cutBtn.classList.add('show');
    }, 7500);
  };
})();

</script>
<script>
/* ---- finale.js ---- */
// Fireworks and tappable balloons for the celebration after the cake is cut.
(function () {
  let fwCanvas = null, fwRun = false;

  function fireworks(seconds) {
    if (!fwCanvas) {
      fwCanvas = document.createElement('canvas');
      fwCanvas.id = 'fireworks';
      document.body.appendChild(fwCanvas);
    }
    const cv = fwCanvas;
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(window.innerWidth * dpr);
    cv.height = Math.floor(window.innerHeight * dpr);
    const W = cv.width, H = cv.height;
    const cols = [330, 45, 190, 280, 15, 150];
    const rockets = [], sparks = [];
    const start = performance.now();
    let nextLaunch = 0;
    fwRun = true;

    function launch() {
      rockets.push({
        x: W * (0.15 + Math.random() * 0.7), y: H,
        vy: -(H * (0.011 + Math.random() * 0.004)), ty: H * (0.15 + Math.random() * 0.3),
        hue: cols[Math.floor(Math.random() * cols.length)]
      });
    }
    function burst(x, y, hue) {
      const n = 70;
      const heart = Math.random() < 0.3;
      for (let i = 0; i < n; i++) {
        let vx, vy;
        if (heart) {
          const t = (i / n) * Math.PI * 2;
          vx = 16 * Math.pow(Math.sin(t), 3) * 0.22;
          vy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.22;
        } else {
          const a = Math.random() * 6.283, sp = (1 + Math.random() * 4.5);
          vx = Math.cos(a) * sp; vy = Math.sin(a) * sp;
        }
        sparks.push({ x: x, y: y, vx: vx * dpr, vy: vy * dpr, life: 1, hue: hue + Math.random() * 30 - 15 });
      }
    }

    function tick(now) {
      const el = (now - start) / 1000;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      if (el < seconds && now > nextLaunch) { launch(); nextLaunch = now + 350 + Math.random() * 450; }
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.y += r.vy * 0.6;
        ctx.fillStyle = 'hsl(' + r.hue + ',100%,80%)';
        ctx.fillRect(r.x - dpr, r.y, 2 * dpr, 6 * dpr);
        if (r.y <= r.ty) { burst(r.x, r.y, r.hue); rockets.splice(i, 1); }
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.vy += 0.05 * dpr; s.vx *= 0.985; s.life -= 0.013;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.fillStyle = 'hsla(' + s.hue + ',100%,65%,' + s.life + ')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2.2 * dpr * s.life + 0.5, 0, 6.283);
        ctx.fill();
      }
      if (el < seconds + 3 || sparks.length || rockets.length) requestAnimationFrame(tick);
      else { ctx.clearRect(0, 0, W, H); fwRun = false; }
    }
    requestAnimationFrame(tick);
  }

  // ---------- balloons ----------
  const BAL = ['#ff5fa2', '#ffd45c', '#7fd6ff', '#c49bff', '#ff8a5c', '#7be0a4'];
  function balloons(count) {
    let layer = document.getElementById('balloons');
    if (!layer) {
      layer = document.createElement('div');
      layer.id = 'balloons';
      document.body.appendChild(layer);
    }
    for (let i = 0; i < count; i++) {
      setTimeout(function () { one(layer, i); }, i * 380 + Math.random() * 300);
    }
  }
  function one(layer, i) {
    const b = document.createElement('div');
    b.className = 'balloon';
    const dur = 9 + Math.random() * 5;
    b.style.left = (4 + Math.random() * 86) + '%';
    b.style.setProperty('--c', BAL[i % BAL.length]);
    b.style.setProperty('--sway', (14 + Math.random() * 22) + 'px');
    b.style.animationDuration = dur + 's, ' + (2 + Math.random() * 1.5) + 's';
    b.innerHTML = '<span class="bstring"></span>';
    function pop(e) {
      if (e) e.stopPropagation();
      const r = b.getBoundingClientRect();
      for (let k = 0; k < 10; k++) {
        const p = document.createElement('i');
        p.className = 'bpiece';
        p.style.left = (r.left + r.width / 2) + 'px';
        p.style.top = (r.top + r.height / 2) + 'px';
        p.style.background = BAL[i % BAL.length];
        const a = (k / 10) * 6.283;
        p.style.setProperty('--dx', Math.cos(a) * 46 + 'px');
        p.style.setProperty('--dy', Math.sin(a) * 46 + 'px');
        layer.appendChild(p);
        setTimeout(function () { p.remove(); }, 600);
      }
      b.remove();
    }
    b.addEventListener('pointerdown', pop);
    b.addEventListener('animationend', function (ev) { if (ev.animationName === 'balloonUp') b.remove(); });
    layer.appendChild(b);
  }

  window.addEventListener('shalu:celebrate', function () {
    fireworks(9);
    balloons(14);
  });
})();

// ---------- Rose bouquet scene (after the gift message, before the memories) ----------

    '<ellipse cx="62" cy="168" rx="26" ry="11" transform="rotate(-30 62 168)" fill="#2e8b3d"/><ellipse cx="178" cy="168" rx="26" ry="11" transform="rotate(30 178 168)" fill="#2e8b3d"/>' +
    '<ellipse cx="90" cy="108" rx="22" ry="9" transform="rotate(-50 90 108)" fill="#3da24d"/><ellipse cx="152" cy="108" rx="22" ry="9" transform="rotate(50 152 108)" fill="#3da24d"/>' +
    rose(70, 140, 26, '#d90f3c', '#ff4f6e') + rose(170, 140, 26, '#c2255c', '#ff6fa8') +
    rose(100, 100, 28, '#e11d48', '#ff5c7c') + rose(145, 100, 28, '#ff5f9a', '#ffa3c4') + rose(120, 70, 30, '#d90f3c', '#ff4f6e') +
    '<path d="M60 175L180 175L132 285L108 285Z" fill="#ffd9e8" stroke="#ff9ec4" stroke-width="2"/>' +
    '<path d="M60 175L120 215L180 175" fill="#fff" opacity=".55"/>' +

  function petals(host) {
    for (let i = 0; i < 26; i++) {
      const p = document.createElement('i');

  window.addEventListener('shalu:giftclosed', function () {

<script>
/* ---- memories.js ---- */
// Memories finale (runs after the gift message):
// starry sky -> card with a heart -> tap -> note box + two photos -> card folds -> photos fly into a glowing 3D heart.
// Photos/notes are set in message.js (SHALU_PHOTOS, SHALU_NOTES). With no photos this part is skipped.
(function () {
  const AUTO_OPEN = true;     // open by itself right after the gift message (set false to use the button only)
  const SLIDE_MS = 5000;

  let photos = [], pairs = [];
  let btn = null, root = null, idx = 0, timer = 0, starRaf = 0;

  function normalise() {
    return (window.SHALU_PHOTOS || []).map(function (p) {
      return typeof p === 'string' ? { src: p, caption: '' } : p;
    });
  }

  // No list given? Look for 1.jpg, 2.jpg, 3.jpg ... in photos/ (or next to index.html), up to MAX_AUTO.
  const MAX_AUTO = 30;
  function discover(cb) {
    const found = [];
    let left = MAX_AUTO;
    function done() { if (!--left) cb(found.filter(Boolean).map(function (src) { return { src: src, caption: '' }; })); }
    for (let n = 1; n <= MAX_AUTO; n++) {
      (function (n) {
        const a = new Image();
        a.onload = function () { found[n] = 'photos/' + n + '.jpg'; done(); };
        a.onerror = function () {
          const b = new Image();
          b.onload = function () { found[n] = n + '.jpg'; done(); };
          b.onerror = done;
          b.src = n + '.jpg';
        };
        a.src = 'photos/' + n + '.jpg';
      })(n);
    }
  }

  function preload(cb) {
    const list = normalise();
    if (!list.length) return discover(cb);
    let left = list.length;
    const ok = [];
    if (!left) return cb([]);
    list.forEach(function (p, i) {
      const im = new Image();
      im.onload = function () { ok[i] = p; if (!--left) cb(ok.filter(Boolean)); };
      im.onerror = function () { if (!--left) cb(ok.filter(Boolean)); };
      im.src = p.src;
    });
  }

  function buildPairs() {
    const notes = window.SHALU_NOTES || [];
    pairs = [];
    for (let i = 0; i < photos.length; i += 2) {
      const a = photos[i], b = photos[i + 1];
      const n = pairs.length;
      pairs.push({
        imgs: b ? [a.src, b.src] : [a.src],
        note: notes[n] || [a.caption, b && b.caption].filter(Boolean).join(' • ') || 'Happy Birthday, my love ❤️'
      });
    }
  }

  function ensureButton() {
    if (btn) { btn.classList.add('show'); return; }
    btn = document.createElement('button');
    btn.id = 'memBtn';
    btn.textContent = '📸 Our memories';
    btn.onclick = open;
    document.body.appendChild(btn);
    requestAnimationFrame(function () { btn.classList.add('show'); });
  }

  window.addEventListener('shalu:giftclosed', function () {
    preload(function (ok) {
      photos = ok;
      if (!photos.length) return;
      buildPairs();
      ensureButton();
    });
  });

  // opens after the rose bouquet scene
  window.addEventListener('shalu:rosesdone', function () {
    if (AUTO_OPEN && photos.length && !window.CAKE.memSeen) setTimeout(open, 500);
  });

  // ---------- starry sky ----------
  function stars(cv) {
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = window.innerWidth * dpr; cv.height = window.innerHeight * dpr;
    const s = [];
    for (let i = 0; i < 120; i++) s.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 });
    function f(now) {
      starRaf = requestAnimationFrame(f);
      ctx.clearRect(0, 0, cv.width, cv.height);
      s.forEach(function (o) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.65 * Math.abs(Math.sin(now / 900 + o.p))) + ')';
        ctx.beginPath();
        ctx.arc(o.x * cv.width, o.y * cv.height, o.r * dpr, 0, 6.283);
        ctx.fill();
      });
    }
    starRaf = requestAnimationFrame(f);
  }

  const HANDS =
    '<svg viewBox="0 0 120 60" width="96" height="48" aria-hidden="true"><g fill="#fde3d0" stroke="#e7b9a0" stroke-width="1.5">' +
    '<path d="M8 50q4-22 26-26l14 8q6 4 0 10l-14 8z"/><path d="M112 50q-4-22-26-26l-14 8q-6 4 0 10l14 8z"/></g></svg>';

  // ---------- open / close ----------
  function open() {
    if (root) return;
    root = document.createElement('div');
    root.id = 'memories';
    root.innerHTML =
      '<canvas class="mstars"></canvas>' +
      '<button class="mclose" aria-label="Close">✕</button>' +
      '<div class="mstage" id="mCard"><div class="mcard"><span class="mheart">❤️</span>' + HANDS + '<p>Tap to open</p></div></div>';
    document.body.appendChild(root);
    stars(root.querySelector('.mstars'));
    root.querySelector('.mclose').onclick = close;
    document.getElementById('mCard').onclick = openCard;
    window.CAKE.memOpen = true;
    window.CAKE.memSeen = true;
  }

  function close() {
    clearInterval(timer);
    cancelAnimationFrame(starRaf);
    if (root) root.remove();
    root = null;
    window.CAKE.memOpen = false;
  }

  function openCard() {
    const stage = document.getElementById('mCard');
    stage.onclick = null;
    stage.querySelector('.mcard').classList.add('opening');
    setTimeout(showSlides, 650);
  }

  function showSlides() {
    const stage = document.getElementById('mCard');
    stage.innerHTML =
      '<div class="mslides">' +
      '<div class="mnote" id="mNote"></div>' +
      '<div class="mpair" id="mPair"></div>' +
      '<div class="mnav"><button id="mPrev" aria-label="Previous">‹</button><span id="mDots"></span><button id="mNext" aria-label="Next">›</button></div>' +
      '<button class="mall" id="mAll">See all ❤️</button></div>';
    idx = 0;
    draw();
    document.getElementById('mPrev').onclick = function () { go(-1); };
    document.getElementById('mNext').onclick = function () { go(1); };
    document.getElementById('mAll').onclick = fold;
    let x0 = null;
    const pr = document.getElementById('mPair');
    pr.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
    pr.addEventListener('pointerup', function (e) {
      if (x0 !== null && Math.abs(e.clientX - x0) > 40) go(e.clientX < x0 ? 1 : -1);
      x0 = null;
    });
    restart();
  }

  function restart() {
    clearInterval(timer);
    timer = setInterval(function () {
      if (idx >= pairs.length - 1) fold(); else go(1);
    }, SLIDE_MS);
  }

  function go(d) {
    idx = (idx + d + pairs.length) % pairs.length;
    draw();
    restart();
  }

  function draw() {
    const p = pairs[idx];
    const note = document.getElementById('mNote');
    const pair = document.getElementById('mPair');
    if (!note || !pair) return;
    note.textContent = p.note;
    pair.innerHTML = p.imgs.map(function (s) { return '<img src="' + s + '" alt="">'; }).join('');
    [note, pair].forEach(function (el) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); });
    pair.className = 'mpair swap' + (p.imgs.length === 1 ? ' single' : '');
    document.getElementById('mDots').textContent = (idx + 1) + ' / ' + pairs.length;
  }

  // ---------- fold the card, then the heart ----------
  function fold() {
    clearInterval(timer);
    const stage = document.getElementById('mCard');
    if (!stage) return;
    const sl = stage.querySelector('.mslides');
    if (sl) sl.classList.add('folding');
    setTimeout(showHeart, 900);
  }

  function showHeart() {
    const stage = document.getElementById('mCard');
    if (!stage) return;
    const N = Math.max(photos.length * 2, 36);
    const scale = Math.min(window.innerWidth * 0.95, window.innerHeight * 0.72) / 36;
    const size = scale * 4.2;
    const items = [];
    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      items.push({ x: x * scale, y: y * scale - scale * 1.2, i: i, z: y });
    }
    let html = '<div class="mheartwrap"><div class="mheartspin">';
    items.forEach(function (o) {
      const p = photos[o.i % photos.length];
      const rot = ((o.i * 37) % 21) - 10;
      html += '<img class="htile" style="--x:' + o.x.toFixed(1) + 'px;--y:' + o.y.toFixed(1) + 'px;--r:' + rot +
        'deg;--d:' + (o.i * 0.045).toFixed(2) + 's;width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) +
        'px;z-index:' + Math.round(o.z + 20) + '" src="' + p.src + '" alt="">';
    });
    html += '</div></div><p class="mfoot">Happy Birthday, ' + (window.SHALU_NAME || 'Shalu') + ' ❤️</p>';
    stage.innerHTML = html;
  }
})();

</script>
<script>
/* ---- interact.js ---- */
// Play with the cake: drag to spin it, and after it is cut tap the slice to take a bite.
(function () {
  const C = window.CAKE;
  const THREE = C.THREE;
  let enabled = false, down = false, moved = 0, lastX = 0, vel = 0, hop = 0;
  let bites = 0;
  const SAYS = ['Yum! 😋', 'Mmm, so sweet 🍓', 'One more bite… 🍰', 'Save a bite for me 😘', 'Okay, that is enough, sweetheart 🥰'];

  function onUI(t) {
    return t.closest && t.closest('button, #gift, #letter, #memories, #welcome, #intro');
  }

  window.addEventListener('pointerdown', function (e) {
    if (!enabled || C.cutting || C.memOpen || onUI(e.target)) return;
    down = true; moved = 0; lastX = e.clientX; vel = 0; C.dragged = false;
    C.freeze = true;
  });
  window.addEventListener('pointermove', function (e) {
    if (!down) return;
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    moved += Math.abs(dx);
    if (moved > 8) C.dragged = true;
    vel = dx * 0.011;
    C.cake.rotation.y += vel;
  });
  function release() {
    if (!down) return;
    down = false;
    setTimeout(function () { C.dragged = false; }, 60);
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  window.cakeHooks.push(function (now, dt) {
    if (C.cutting) return;
    if (!down && enabled && C.freeze && !C.memOpen) {
      // let go: coast on the spin, then hand back to the slow auto-rotation
      C.cake.rotation.y += vel;
      vel *= 0.94;
      if (Math.abs(vel) < 0.004) C.freeze = false;
    }
  });

  // ---------- tapping the slice ----------
  const tmp = new THREE.Vector3();
  function floatText(x, y, txt) {
    const el = document.createElement('div');
    el.className = 'yum';
    el.textContent = txt;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1500);
  }

  window.addEventListener('click', function (e) {
    if (!C.sliceReady || C.dragged || onUI(e.target)) return;
    tmp.set(0, 0.9, 2.5).project(C.camera);
    const sx = (tmp.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-tmp.y * 0.5 + 0.5) * window.innerHeight;
    const R = 0.22 * Math.min(window.innerWidth, window.innerHeight);
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > R) return;
    hop = performance.now();
    floatText(e.clientX, e.clientY - 20, SAYS[Math.min(bites, SAYS.length - 1)]);
    for (let i = 0; i < 4; i++) {
      setTimeout(function () { floatText(e.clientX + (Math.random() - 0.5) * 120, e.clientY - 10, '❤️'); }, i * 90);
    }
    bites++;
  });

  window.cakeHooks.push(function (now) {
    if (!hop) return;
    const k = (now - hop) / 500;
    if (k >= 1) { C.sliceHop = 0; hop = 0; return; }
    C.sliceHop = Math.abs(Math.sin(k * Math.PI * 2)) * 0.22 * (1 - k);
  });

  const prev = window.startCake;
  window.startCake = function () {
    if (prev) prev();
    setTimeout(function () { enabled = true; }, 3000);
  };
})();

</script>
<script>
/* ---- music.js ---- */
(function () {
  // Put your song in the project folder and name it music.mp3
  const audio = new Audio('music.mp3');
  audio.loop = true;
  audio.preload = 'auto';
  audio.volume = 0;

  let ok = true;
  let muted = false;
  let started = false;

  const btn = document.createElement('button');
  btn.id = 'muteBtn';
  btn.textContent = '🔊';
  document.body.appendChild(btn);

  audio.addEventListener('error', function () {
    ok = false;
    btn.classList.remove('show');
  });

  btn.addEventListener('click', function () {
    muted = !muted;
    audio.muted = muted;
    btn.textContent = muted ? '🔇' : '🔊';
  });

  function fadeIn() {
    let v = 0;
    const id = setInterval(function () {
      v += 0.05;
      audio.volume = Math.min(v, 0.85);
      if (v >= 0.85) clearInterval(id);
    }, 150);
  }

  document.addEventListener('visibilitychange', function () {
    if (!started || !ok) return;
    if (document.hidden) audio.pause();
    else { const p = audio.play(); if (p && p.catch) p.catch(function () {}); }
  });

  const prev = window.startCake;
  window.startCake = function () {
    if (prev) prev();
    if (started) return;
    started = true;
    const p = audio.play();
    if (p && p.catch) p.catch(function () {});
    fadeIn();
    if (ok) btn.classList.add('show');
  };
})();

</script>
<script>
/* ---- main.js ---- */
// Glue: floating hearts, bokeh, vignette, welcome button -> start the cake, and the love-letter message.
(function () {
  // ---------- background: vignette, bokeh, floating hearts ----------
  const vg = document.createElement('div');
  vg.id = 'vignette';
  document.body.appendChild(vg);

  const COLS = ['#ff7eb6', '#ffd45c', '#c8a2ff', '#ff4f93', '#9be7ff'];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'bokeh';
    const s = 30 + Math.random() * 70;
    b.style.width = b.style.height = s + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.top = 30 + Math.random() * 70 + '%';
    b.style.background = COLS[i % COLS.length];
    b.style.animationDuration = 10 + Math.random() * 10 + 's';
    b.style.animationDelay = -Math.random() * 10 + 's';
    document.body.appendChild(b);
  }

  const heartsBox = document.getElementById('hearts');
  const HEARTS = ['❤️', '💖', '💗', '💕', '💝'];
  function heart() {
    if (document.hidden || !heartsBox) return;
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = 14 + Math.random() * 20 + 'px';
    const d = 6 + Math.random() * 6;
    h.style.animationDuration = d + 's';
    heartsBox.appendChild(h);
    setTimeout(function () { h.remove(); }, d * 1000 + 200);
  }
  setInterval(heart, 700);

  // ---------- the letter ----------
  const msgBtn = document.createElement('button');
  msgBtn.id = 'msgBtn';
  msgBtn.textContent = '💌 Read my message';
  document.body.appendChild(msgBtn);

  const letter = document.createElement('div');
  letter.id = 'letter';
  document.body.appendChild(letter);

  msgBtn.addEventListener('click', function () {
    const lines = window.SHALU_MESSAGE || [];
    let html = '<div class="letter-card"><h2>' + (window.SHALU_TITLE || 'Happy Birthday!') + '</h2>';
    lines.forEach(function (l, i) {
      html += '<p style="animation-delay:' + (0.5 + i * 1.1) + 's">' + l + '</p>';
    });
    if (window.SHALU_SIGN) html += '<p class="sign" style="animation-delay:' + (0.5 + lines.length * 1.1) + 's">' + window.SHALU_SIGN + ' ❤️</p>';
    html += '<button id="closeLetter">Close ❤️</button></div>';
    letter.innerHTML = html;
    letter.classList.add('open');
    document.getElementById('closeLetter').onclick = function () { letter.classList.remove('open'); };
  });

  // ---------- welcome -> cake ----------
  const welcome = document.getElementById('welcome');
  const reveal = document.getElementById('reveal');
  const openBtn = document.getElementById('openBtn');
  let opened = false;
  openBtn.addEventListener('click', function () {
    if (opened) return;
    opened = true;
    welcome.classList.add('leaving');
    setTimeout(function () { welcome.classList.add('hidden'); }, 1300);
    if (reveal) reveal.remove();
    if (window.startCake) window.startCake();
    setTimeout(function () { msgBtn.classList.add('show'); }, 5000);
  });
})();

</script>
